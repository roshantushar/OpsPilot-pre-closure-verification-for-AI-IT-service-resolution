  backend: live
  prompt_version: v1
  descriptor_version: v2
  compact_returns: true
  step_cap: 10
  budget_cap_usd: 0.03
arms:
- arm: rules
  overrides:
    verifier: rules
- arm: read_note
  overrides:
    verifier: read_note
    require_evidence: false
- arm: workflow
  overrides:
    verifier: workflow
- arm: agent
  reuse_from: D4-1/opspilot_v1
- arm: hybrid
